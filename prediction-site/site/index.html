<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProScore Predictions</title>
  <meta name="description" content="Daily football predictions from a statistical model trained on every recorded result.">
  <meta name="theme-color" content="#0b1424">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Montserrat:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f2792b'/%3E%3Cpath d='M20 40l8-10 7 6 10-14' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="ProScore home">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#e2581a"/></linearGradient></defs><path d="M18 42l9-12 8 7 11-16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">ProScore</span>
    </a>
    <div class="top-actions">
      <button class="pill-btn" id="langBtn" aria-label="Change language">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span id="langLabel">EN</span>
      </button>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden></div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <p data-i18n="disclaimer"></p>
  </footer>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" data-route="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav_home"></span></a>
    <a href="#/today" data-route="today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="nav_today"></span></a>
    <a href="#/coupons" data-route="coupons"><svg viewBox="0 0 24 24"><path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path d="M14 7v12" stroke-dasharray="2 2"/></svg><span data-i18n="nav_coupons"></span></a>
    <a href="#/record" data-route="record"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav_record"></span></a>
    <a href="#/tables" data-route="tables"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span data-i18n="nav_tables"></span></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
