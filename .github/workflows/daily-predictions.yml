name: Daily predictions

on:
  schedule:
    # GitHub skips most scheduled runs on small repos, so this is only a backup that restarts the chain;
    # the "next-run" job below is what really keeps the site updated every ~2 hours
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prediction-site/**"
      - ".github/workflows/daily-predictions.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: daily-predictions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # keeps downloaded NBA box scores / NHL weeks between runs so only new games are fetched
      - uses: actions/cache@v4
        with:
          path: prediction-site/.cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Install PDF reader (official NBA injury report)
        run: pip install pypdf

      - name: Download results, fit model, predict, settle tips, backtest
        working-directory: prediction-site
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python engine/predict.py

      - name: Commit updated data (keeps the track record)
        run: |
          git config user.name "proscore-bot"
          git config user.email "proscore-bot@users.noreply.github.com"
          git add prediction-site/site/data
          git diff --cached --quiet || git commit -m "Daily predictions $(date -u +%F)"
          git push || echo "push skipped"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prediction-site/site

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Self-scheduling: wait ~2 hours, then start the next run (GITHUB_TOKEN is allowed to dispatch workflows).
  # Only the newest run keeps the chain going, so a backup cron run never doubles it up.
  next-run:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait, then start the next update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 6600
          newer=$(gh run list --workflow daily-predictions.yml --limit 20 --json number \
                  --jq "[.[] | select(.number > ${{ github.run_number }})] | length")
          if [ "$newer" -gt 0 ]; then echo "a newer run exists, it continues the chain"; exit 0; fi
          gh workflow run daily-predictions.yml --ref main
